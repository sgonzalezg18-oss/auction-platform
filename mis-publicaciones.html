<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Publicaciones — Subastas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/estilos.css" />
</head>
<body>
  <header class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
      <a href="index.html" class="text-xl font-bold text-blue-700">🚗 Subastas de Vehículos</a>
      <nav class="flex items-center gap-4">
        <a href="index.html">Inventario</a>
        <span class="text-gray-400">|</span>
        <span id="userNombre" class="text-sm text-gray-600"></span>
        <button id="logoutBtn" class="text-gray-700 hover:text-red-600 text-sm">Cerrar Sesión</button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mis Publicaciones</h1>
        <p class="text-sm text-gray-500">Busca, edita o elimina tus vehículos en subasta.</p>
      </div>
      <a href="publicar.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Nueva Publicación</a>
    </div>
    <div id="gridMisPublicaciones" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <script type="module" src="./js/auth.js"></script>
  <script type="module" src="./js/vehiculos.js"></script>

</html>
