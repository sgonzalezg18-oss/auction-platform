<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subasta en Tiempo Real</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/estilos.css" />
</head>
<body>
  <header class="bg-white border-b sticky top-0 z-10 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
      <a href="index.html" class="text-xl font-bold text-blue-700">🚗 Subastas de Vehículos</a>
      <nav class="flex items-center gap-4">
        <a href="index.html" class="text-gray-700 hover:text-blue-700 font-medium">Inventario</a>
        <a id="navPublicar" href="publicar.html" class="hidden text-gray-700 hover:text-blue-700 font-medium">Publicar</a>
        <a id="navMisPublicaciones" href="mis-publicaciones.html" class="hidden text-gray-700 hover:text-blue-700 font-medium">Mis Publicaciones</a>
        <a id="navLogin" href="login.html" class="text-gray-700 hover:text-blue-700 font-medium">Iniciar Sesión</a>
        <a id="navRegistro" href="registro.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Registrarse</a>
        <div id="userMenu" class="hidden items-center gap-3">
          <span id="userNombre" class="text-sm text-gray-600"></span>
          <button id="logoutBtn" class="text-gray-700 hover:text-red-600 text-sm">Cerrar Sesión</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <a href="index.html" class="text-blue-700 hover:underline text-sm">← Volver al inventario</a>
    <div id="detalleSubasta" class="mt-4">
      <div class="text-center py-10 text-gray-500">Cargando subasta...</div>
    </div>
  </main>

  <script type="module" src="./js/auth.js"></script>
  <script type="module" src="./js/subastas.js"></script>
</body>
</html>
